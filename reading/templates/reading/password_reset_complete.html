
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            font-size: 32px;
        }

        h1 {
            margin-bottom: 15px;
            color: #1e3a8a;
            font-size: 26px;
        }

        p {
            margin-bottom: 25px;
            color: #64748b;
            line-height: 1.6;
        }

        a {
            display: block;
            padding: 13px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">✓</div>
        <h1>Password Changed!</h1>
        <p>Your password has been reset successfully. You can now log in using your username and new password.</p>
        <a href="{% url 'login' %}">Go to Login</a>
    </div>
    
</body>
</html>
