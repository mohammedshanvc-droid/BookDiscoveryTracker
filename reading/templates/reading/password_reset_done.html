<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent | Book Discovery & Reading Tracker</title>
    <style>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f3ed;
        color: #35241f;
    }

    .container {
        width: 100%;
        max-width: 450px;
        padding: 40px 30px;
        background: #fff;
        border: 1px solid #eee5df;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 12px 35px rgba(53, 36, 31, 0.09);
    }

    .icon {
        width: 75px;
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 22px;
        border-radius: 50%;
        background: #e5f3e8;
        color: #28613b;
        font-size: 35px;
    }

    h1 {
        margin-bottom: 15px;
        color: #35241f;
        font-size: 27px;
        line-height: 1.4;
    }

    p {
        margin-bottom: 25px;
        color: #777;
        font-size: 14px;
        line-height: 1.8;
    }

    .button {
        display: inline-block;
        padding: 13px 25px;
        border-radius: 25px;
        background: #572b35;
        color: white;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.25s ease, transform 0.25s ease;
    }

    .button:hover {
        background: #713b47;
        transform: translateY(-2px);
    }

    .note {
        margin-top: 22px;
        margin-bottom: 0;
        font-size: 13px;
        color: #888;
    }

    @media (max-width: 500px) {
        body {
            padding: 15px;
        }

        .container {
            padding: 32px 22px;
            border-radius: 13px;
        }

        h1 {
            font-size: 24px;
        }

        .button {
            max-width: 100%;
        }
    }
</style>

    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✉</div>

        <h1>Check Your Email</h1>

        <p>
            If an account exists with the email address you entered,
            you will receive a password reset link shortly.
            Please check your inbox and spam folder.
        </p>

        <a href="{% url 'login' %}" class="button">
            Back to Login
        </a>

        <p class="note">
            The reset link expires after one hour.
        </p>
    </div>



    
</body>
</html>
